# Paper-trade SHORT: misma estrategia que base_short.
# Sin órdenes reales: python cli.py paper-live --config configs/live_short.yaml
# Con órdenes reales en Bybit Testnet: python cli.py paper-live --config configs/live_short.yaml --execute
# Posiciones visibles en: https://testnet.bybit.com/

extends: base_short.yaml

paper_live:
  start_date: "2024-01-01"
  end_date: "today"
  initial_capital: 10000.0
  poll_interval_seconds: 120

risk:
  risk_pct: 0.009
  max_open_positions: 1
  max_drawdown_stop_pct: 0.15
  max_consecutive_losses: 10
