# Paper-trade: misma estrategia que base.
# Sin órdenes reales: python cli.py paper-live --config configs/live.yaml
# Con órdenes en Testnet: python cli.py paper-live --config configs/live.yaml --execute

extends: base.yaml

paper_live:
  start_date: "2024-01-01"
  end_date: "today"
  initial_capital: 10000.0
  poll_interval_seconds: 120   # con --execute: revisar cada 2 min si cerró vela 4H

# Riesgo algo más conservador en paper (opcional; quitar para igualar a base)
risk:
  risk_pct: 0.009
  max_open_positions: 1
  max_drawdown_stop_pct: 0.15
  max_consecutive_losses: 10
